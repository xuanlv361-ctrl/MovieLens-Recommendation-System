[project]
name = "movielens-recsys"
version = "0.1.0"
description = "MovieLens 100K recommendation system: collaborative filtering, SVD, and a Streamlit/PyQt5 demo"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24,<3",
    "pandas>=2.0,<3",
    "scipy>=1.11,<2",
    "scikit-learn>=1.3,<2",
    "matplotlib>=3.7,<4",
    "seaborn>=0.13,<1",
    "jupyter>=1.0,<2",
    "jupyterlab>=4.0,<5",
    "streamlit>=1.28,<2",
    "PyQt5>=5.15,<6",
    "python-dotenv>=1.0,<2",
    "requests>=2.31,<3",
    "plotly>=5.18,<6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0,<9",
    "ruff>=0.4,<1",
]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E402"]

[tool.ruff.lint.per-file-ignores]
# Long CSS/QSS style blocks and UI copy in the demo front ends.
"app.py" = ["E501", "B905"]
"qt_app.py" = ["E501", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]
